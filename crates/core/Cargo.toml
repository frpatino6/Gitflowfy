[package]
name = "gitflowfy-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
bytemuck = { version = "1.14", features = ["derive"] }
ctrlc = "3.4"

[[bin]]
name = "gitflowfy"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.10"