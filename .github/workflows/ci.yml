name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu
          override: true
          
      - name: Install Rust (Linux)
        if: runner.os == 'Linux'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          override: true

      - name: Install mingw (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install mingw -y --no-progress
          echo "C:\Program Files\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace --release

      - name: Run gates
        run: |
          cargo run --package gitflowfy-core -- version
          cargo run --package gitflowfy-core -- git test_repo -- status
          cargo run --package gitflowfy-core -- audit test_repo
        env:
          PATH: ${{ env.PATH }};C:\msys64\mingw64\bin
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Run gates (Linux)
        run: |
          cargo run --package gitflowfy-core -- version
          cargo run --package gitflowfy-core -- git test_repo -- status
          cargo run --package gitflowfy-core -- audit test_repo
        if: runner.os == 'Linux'

      - name: Run overhead gate (G2)
        run: cargo test --package gitflowfy-core --test cli -- test_runs_with_no_display
        if: runner.os == 'Windows'

      - name: Constitutional audit
        run: |
          echo "Checking Article I..."
          cargo tree -p gitflowfy-core --all-features | grep -E "libgit2|git2|gix|jgit" && exit 1 || echo "OK: No embedded Git crates"
          
          echo "Checking Article VII..."
          MEMBERS=$(grep -A 10 '\[workspace\]' Cargo.toml | grep -c 'crates/')
          if [ "$MEMBERS" -gt 3 ]; then exit 1; fi
          echo "OK: ${MEMBERS} crates (max 3)"
          
          echo "Checking Article I..."
          ! grep -r 'Command::new("git")' --include="*.rs" crates/ | grep -v "crates/core" || exit 1
          echo "OK: No git spawns outside crates/core"
        shell: bash