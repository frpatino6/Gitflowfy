[workspace]
resolver = "2"
members = [
    "crates/core",
    "apps/desktop",
]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "2.0"
tauri = { version = "2.0" }
tauri-build = { version = "2.0" }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1